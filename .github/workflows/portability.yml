name: portability

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      # SEM fail-fast: o padrão CANCELA os outros sistemas quando um falha, e o
      # log deles sai como "The operation was canceled" — indistinguível de
      # falha real para quem lê. Em 2026-08-10 o Windows quebrou, macOS e Linux
      # apareceram vermelhos por cancelamento, e a leitura de fora foi "os três
      # sistemas estão falhando". Uma esteira de PORTABILIDADE tem que dizer em
      # QUAIS sistemas o problema existe — é a única pergunta que ela responde.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install jq
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y jq; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install jq; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install jq -y; fi

      # Estado medido da suíte contra um ambiente equivalente a este runner
      # (PATH sem `claude`, sem plugin instalado), rodando os mesmos globs de
      # baixo, um arquivo por vez, para que nenhuma falha fique escondida pelo
      # `set -e`. Quem repetir a medição roda o mesmo bloco e compara.
      #
      # Medido em 2026-08-06 sobre a árvore de trabalho, sem `claude` no PATH:
      # 54 suítes (20 + 1 + 3 + 2 nos globs de Python, 21 + 6 + 1 nos de shell),
      # todas verdes, bloco inteiro saindo 0 sob `set -e`.
      #
      #
      # Commit parcial ainda faz a esteira nascer vermelha: os globs rodam o que
      # foi COMMITADO, e suíte cujo conserto ficou na árvore reprova no runner.
      - name: Release-gate checks (mesmos do hook de commit)
        shell: bash
        run: |
          set -e
          # NO WINDOWS, `bash` DO PATH É O WSL — e o runner não tem distro instalada.
          # Toda suíte que dispara `subprocess.run(["bash", ...])` recebia
          # "Windows Subsystem for Linux has no installed distributions." em UTF-16,
          # o que chega ao Python como stdout VAZIO e estoura três camadas acima.
          # O Python é filho DESTE bash, então herda este PATH: pôr o diretório do
          # Git Bash na frente aqui resolve, e não depende do GITHUB_PATH ganhar do
          # System32 (não ganhou). `/usr/bin` é onde o Git Bash mora no MinGW.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/usr/bin:$PATH"
          fi
          PY="$(command -v python3 || command -v python)"
          # A CONFERÊNCIA É PARTE DO CONSERTO. Sem ela o ajuste acima falha em
          # SILÊNCIO: o passo segue, a suíte quebra vinte linhas depois com "stdout
          # vazio", e a causa some. Foi assim que a primeira tentativa passou batido.
          if [ "$RUNNER_OS" = "Windows" ]; then
            eco="$("$PY" -c "import subprocess;print(subprocess.run(['bash','-c','echo VIVO'],capture_output=True,text=True).stdout.strip())")"
            echo "o bash que o Python resolve responde: '$eco'"
            [ "$eco" = "VIVO" ] || { echo "::error::o bash que o Python resolve ainda e o WSL"; exit 1; }
          fi
          bash scripts/sync-shared.sh --check
          # Glob que não casa nada roda zero teste e fica verde — foi assim que a
          # esteira "passou" sem executar suíte nenhuma. Cada padrão é contado, e
          # padrão com zero arquivo reprova o passo.
          roda() {
            runner="$1"; shift
            for pat in "$@"; do
              n=0
              for t in $pat; do
                [ -f "$t" ] || continue
                n=$((n + 1)); $runner "$t"
              done
              [ "$n" -gt 0 ] || { echo "::error::nenhum arquivo casou em $pat"; exit 1; }
              echo "  $pat → $n suíte(s)"
            done
          }
          roda "$PY" 'plugins/*/lib/test_*.py' '_shared/test_*.py' 'scripts/test_*.py' 'plugins/*/hooks/test_*.py'
          roda bash 'plugins/*/hooks/test_*.sh' 'plugins/*/lib/test_*.sh' 'scripts/test_*.sh' '.claude/hooks/test_*.sh' 'plugins/*/skills/*/test_*.sh'
          "$PY" scripts/hook_contract.py --baseline .claude/hook-contract.baseline.json --fail-on high
          "$PY" scripts/public_repo_check.py
