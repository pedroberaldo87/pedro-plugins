name: portability

on:
  push:
  pull_request:
  # Disparo manual com FILTRO — o laço de conserto não cabe em rodadas de 24 min.
  # Consertar uma classe de defeito e esperar a esteira inteira para saber se funcionou
  # é o que fez a campanha de 2026-08-10 custar quinze pushes. Com o filtro, a classe
  # se mede em minutos: `gh workflow run portability.yml -f py='...' -f sh='...'`.
  # Sem argumento, roda tudo — o padrão continua sendo a esteira completa.
  workflow_dispatch:
    inputs:
      py:
        description: "globs das suítes Python (espaço entre eles); vazio = todas"
        required: false
        default: ""
      sh:
        description: "globs das suítes de shell (espaço entre eles); vazio = todas"
        required: false
        default: ""
      os:
        description: "sistema a rodar"
        required: false
        default: "windows-latest"
        type: choice
        options: ["windows-latest", "ubuntu-latest", "macos-latest", "todos"]

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    # Suíte pendurada não pode virar job de 6 h: o maior job legítimo (Windows)
    # fecha em ~15 min; passou de 30, é travamento — falha visível, runner livre.
    timeout-minutes: 30
    # O console do Windows de fábrica é cp1252, e `print("── …")` de uma SUÍTE
    # morre lá com UnicodeEncodeError antes de testar coisa alguma — foi o que
    # derrubava o job do Windows no primeiro arquivo do glob (`test_cfgjson.py`),
    # escondendo as outras 78 suítes com o mesmo texto. Isto muda SÓ os três
    # canais de texto; o encoding de ARQUIVO fica como o sistema manda, que é
    # justamente o que uma esteira de portabilidade não pode mascarar (`PYTHONUTF8`
    # mexeria nos dois). Os PROGRAMAS que precisam disso já se viram sozinhos —
    # `cfgjson.py` e `conformance.py` chamam `reconfigure(encoding="utf-8")`.
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      # SEM fail-fast: o padrão CANCELA os outros sistemas quando um falha, e o
      # log deles sai como "The operation was canceled" — indistinguível de
      # falha real para quem lê. Em 2026-08-10 o Windows quebrou, macOS e Linux
      # apareceram vermelhos por cancelamento, e a leitura de fora foi "os três
      # sistemas estão falhando". Uma esteira de PORTABILIDADE tem que dizer em
      # QUAIS sistemas o problema existe — é a única pergunta que ela responde.
      fail-fast: false
      matrix:
        # No disparo manual com um sistema escolhido, a matriz tem UM elemento — é
        # o que faz a rodada de conserto custar minutos em vez de 24. Push e PR
        # continuam nos três, sempre: a esteira só responde "em quais sistemas" se
        # perguntar aos três.
        os: ${{ (github.event_name == 'workflow_dispatch' && inputs.os != 'todos')
                && fromJSON(format('["{0}"]', inputs.os))
                || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install jq
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y jq; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install jq; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install jq -y; fi

      # Estado medido da suíte contra um ambiente equivalente a este runner
      # (PATH sem `claude`, sem plugin instalado), rodando os mesmos globs de
      # baixo, um arquivo por vez, para que nenhuma falha fique escondida pelo
      # `set -e`. Quem repetir a medição roda o mesmo bloco e compara.
      #
      # Medido em 2026-08-06 sobre a árvore de trabalho, sem `claude` no PATH:
      # 54 suítes (20 + 1 + 3 + 2 nos globs de Python, 21 + 6 + 1 nos de shell),
      # todas verdes, bloco inteiro saindo 0 sob `set -e`.
      #
      #
      # Commit parcial ainda faz a esteira nascer vermelha: os globs rodam o que
      # foi COMMITADO, e suíte cujo conserto ficou na árvore reprova no runner.
      - name: Release-gate checks (mesmos do hook de commit)
        shell: bash
        run: |
          set -e
          PY="$(command -v python3 || command -v python)"
          # O BASH DO WINDOWS NÃO SE CONSERTA AQUI — quem precisa dele procura um
          # que RODE (`test_conformance.py:bash_posix`) e pula declarando quando não
          # há. Três tentativas de arrumar pelo PATH do runner falharam, e a
          # conferência que eu tinha posto aqui virou obstáculo: barrava o job pelo
          # que o teste já sabe tratar.
          bash scripts/sync-shared.sh --check
          # As suítes rodam por `scripts/run_suites.py`, e NÃO por um laço de shell
          # com `set -e`. O laço parava na primeira que falhasse: cada conserto
          # revelava a próxima, uma por rodada de ~4 min — quinze pushes para achar
          # seis defeitos, em 2026-08-10/11. Pior, suíte que PENDURA deixava o job
          # no ar por mais de dez minutos sem dizer QUAL era, porque o log de um job
          # em andamento não sai. O programa dá teto por suíte, segue depois da
          # falha e devolve o placar inteiro numa rodada só.
          #
          # Ele mantém a asserção que o laço tinha: glob que não casa nada REPROVA
          # o passo (glob vazio roda zero teste e fica verde — foi assim que a
          # esteira "passou" sem executar suíte nenhuma).
          # Os globs do disparo manual, quando houver — é o filtro do F0.2. Sem eles
          # (push, PR, ou dispatch sem argumento) vale a lista inteira de sempre.
          FPY="${{ inputs.py }}"
          FSH="${{ inputs.sh }}"
          if [ -n "$FPY" ] || [ -n "$FSH" ]; then
            echo "::notice::rodada FILTRADA — py='$FPY' sh='$FSH' (não é a esteira inteira)"
            # shellcheck disable=SC2086
            "$PY" scripts/run_suites.py --timeout 180 \
              ${FPY:+--py $FPY} ${FSH:+--sh $FSH}
          else
            "$PY" scripts/run_suites.py --timeout 180 \
              --py 'plugins/*/lib/test_*.py' '_shared/test_*.py' 'scripts/test_*.py' 'plugins/*/hooks/test_*.py' \
              --sh 'plugins/*/hooks/test_*.sh' 'plugins/*/lib/test_*.sh' 'scripts/test_*.sh' '.claude/hooks/test_*.sh' 'plugins/*/skills/*/test_*.sh'
          fi
          # Rodada filtrada é para DIAGNÓSTICO: ela não vale como esteira verde, e por
          # isso os cobradores abaixo só rodam na completa. Dizer isso em voz alta,
          # porque "job verde" de rodada filtrada seria a mesma mentira do glob vazio.
          if [ -n "$FPY" ] || [ -n "$FSH" ]; then
            echo "::notice::rodada filtrada NÃO vale como esteira verde"
            exit 0
          fi
          "$PY" scripts/hook_contract.py --baseline .claude/hook-contract.baseline.json --fail-on high
          "$PY" scripts/public_repo_check.py
